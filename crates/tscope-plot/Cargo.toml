[package]
name = "tscope-plot"
version = "0.1.0"
edition = "2021"
description = "tscope 曲线 GUI 的最小演示：Rust 本地生成动态正弦波，验证 eframe + egui_plot 显示方案"

[dependencies]
eframe = "0.36"
egui_plot = "0.37"

# 非主线程创建事件循环（debug 里 plot 窗口异步运行）：Linux 需要
# with_any_thread 扩展；版本与 eframe 自带 winit 一致
[target.'cfg(target_os = "linux")'.dependencies]
winit = { version = "0.30", features = ["x11", "wayland"] }
