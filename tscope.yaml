# ===========================================================================
# tscope 配置模板 —— 当前以 GD32F503RE + SEGGER J-Link 为例
#
# 路径规则：chip.description / chip.pack / firmware.elf 里的相对路径，
# 一律相对「本配置文件所在目录」解析（与运行时所在目录无关）。
#
# 若芯片在 probe-rs 内置支持列表里（如多数 STM32），chip 节只写 name 即可，
# 程序会自动用内置定义，无需 description / pack。
# ===========================================================================

version: 1

probe:
  protocol: swd            # swd | jtag；写错会直接报错
  speed_khz: 1000          # 本板实测 >1000 kHz 不稳定，勿调高
  # 只有一个探针时下面整段留空即可；多个探针时用来选定目标：
  # selector:
  #   vid: 0x1366          # SEGGER
  #   # pid: 0x0101
  #   # serial: "000123456789"

chip:
  name: GD32F503RE         # 必须与描述文件里的变体名精确一致
  # probe-rs 内置列表没有 GD32F50x，所以必须给 target-gen 生成的描述文件：
  description: ../uni_software/bsp/gd/targets/GD32F50x_Series.yaml
  # 若描述文件缺失，程序会指引你用 target-gen 生成；这里顺便给出 pack 位置
  # （v2 起程序可直接调用 target-gen 自动生成，当前版本仅用于拼错误提示）：
  pack: ../probe-rs/GDF503_target_gen/GD32F50x_AddOn_V1.0.1/GigaDevice.GD32F50x_DFP.1.0.1.pack

firmware:
  # 固件镜像：var / watch / plot / flash 从这里解析符号与烧录。
  # elf 与 axf 可同时配置：程序优先用「存在的」elf，回退 axf ——
  # 同一份 yaml 在 Linux（GCC 的 .elf）与 Windows（Keil 的 .axf）通用
  elf: ../uni_software/bsp/gd/build/Project.elf
  # axf: ../keil/Objects/project.axf   # Keil 产物路径（Windows 侧按实际填写）

# ---------------------------------------------------------------------------
# 实时监视组（tscope watch <组名>，Keil Watch 风格）
# - 组名自定（watch1 / watch2 / w1 / 单个字母都行，任意字符串），可定义多组
# - symbols 的语法与 var 命令相同，支持成员路径与数组下标
# - interval_ms 是采样周期（毫秒）
# - max_elems 是复合类型（数组/结构体）最多展开的项数（默认 8）；
#   超出部分显示「…余N」汇总行——修正 Keil 大数组全量刷屏的缺陷
# ---------------------------------------------------------------------------
watch:
  watch1:
    interval_ms: 100
    symbols:
      - theta_ref
      - led_ticker
      - ENC_1_POS_SENSOR.position
      - ENC_1_POS_SENSOR.readAngleCmd
      - ENC_1_POS_SENSOR
  watch2:
    interval_ms: 500
    max_elems: 8          # cali_buff 共 8 个元素，恰好全部展开
    symbols:
      - cali_buff
  watch3:
    interval_ms: 500
    max_elems: 200 
    symbols:
      - ENC_1_POS_SENSOR.velocity_filter

# ---------------------------------------------------------------------------
# 曲线显示（tscope plot <配置名>，独立 GUI 窗口）
# - 每个图组 = 一个子图：组内符号**同图共 Y 轴**（图例列出组内符号），
#   多个组上下叠放、**共享 X 轴联动**（任一图缩放/平移，全体 X 同步）
# - 只支持标量符号（复合类型请写具体成员路径）；同一符号可出现在多个图
# - 窗口内：滚轮缩放/拖拽平移/右键框选/双击复位，空格暂停，
#   +/− 调窗口，r 恢复滚动，s 导出 CSV（当前目录）
# ---------------------------------------------------------------------------
plot:
  plot1:
    interval_ms: 20        # 采样周期（毫秒，可选默认 20）
    window_secs: 5.0       # 滚动窗口宽度（秒，可选默认 5；X 右缘 = 最新数据）
    groups:
      - [theta_ref, led_ticker]                 # 图 1：两个符号同图（量纲差异大时压扁，注意）
      - [ENC_1_POS_SENSOR.position]             # 图 2

# ---------------------------------------------------------------------------
# 若换成官方内置支持的芯片（例如 STM32F407VG），chip 节可简化成：
#
# chip:
#   name: STM32F407VG
#
# （其余 probe / firmware 节不变，description / pack 直接删掉即可。）
# ---------------------------------------------------------------------------
