[package]
name = "tscope"
version = "0.1.0"
edition = "2021"
description = "基于 probe-rs 库的嵌入式调试/监视工具（YAML 配置驱动）"

# 工作区：crates/tscope-plot 是曲线 GUI 库（eframe + egui_plot），
# 先在独立目录开发验证、后并入；demo 示例保留在 crates/tscope-plot/examples
[workspace]
members = ["crates/tscope-plot"]
resolver = "2"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }

# 曲线 GUI 库（plot 子命令）：本地路径依赖，与主程序同仓库同版本管理
tscope-plot = { path = "crates/tscope-plot" }

# probe-rs：来自 crates.io，cargo build 时自动下载，无需手动克隆其源码。
# 版本锁定 0.32（与本工具开发时使用的版本一致；上游 API 变更时再显式升级）。
probe-rs = "0.32"

# 直接解析 ELF / DWARF 调试信息（symbol.rs 只查目标符号，避免官方机制的全量扫描）
gimli = "0.34"
object = { version = "0.40", default-features = false, features = ["read_core", "elf"] }

serde = { version = "1", features = ["derive"] }
# serde_yaml 已停止维护；yaml_serde 是社区接班版本，probe-rs 自身也用它（0.10）
yaml_serde = "0.10"

# TUI：watch 子命令的实时刷新表格（交替屏幕，退出自动恢复终端）
ratatui = "0.30"

# 进度条：flash 烧录的多阶段进度显示（probe-rs 官方 CLI 同款库）
indicatif = "0.18"

# 行编辑：debug 会话的左右光标、历史记录（↑/↓ 翻历史，跨会话持久化）
rustyline = "15"
