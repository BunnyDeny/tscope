[package]
name = "tscope"
version = "0.1.0"
edition = "2021"
description = "基于 probe-rs 库的嵌入式调试/监视工具（YAML 配置驱动）"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }

# 当前以本地源码 checkout（v0.32.0）作为依赖，与本项目 dap-server 用的是同一份代码。
# 相对路径从 tscope 仓库根出发：../probe-rs/probe-rs（两者是同级目录）。
probe-rs = { path = "../probe-rs/probe-rs" }

serde = { version = "1", features = ["derive"] }
# serde_yaml 已停止维护；yaml_serde 是社区接班版本，probe-rs 自身也用它（0.10）
yaml_serde = "0.10"
